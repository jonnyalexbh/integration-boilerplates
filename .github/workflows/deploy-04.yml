name: Deploy 04-express-js-ec2-deploy to EC2

on:
  push:
    branches: [ main ]
    paths:
      - '04-express-js-ec2-deploy/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          mkdir -p ~/app
          cd ~/app
          if [ -d ".git" ]; then
              git fetch origin
              git reset --hard origin/main
          else
              git clone https://github.com/jonnyalexbh/integration-boilerplates.git .
          fi
          cd 04-express-js-ec2-deploy
          npm install
          pm2 stop app || true
          pm2 delete app || true
          pm2 start app.js --name app
          pm2 save
          sudo env PATH=$PATH:/usr/bin /usr/lib/node_modules/pm2/bin/pm2 startup systemd -u $USER --hp $HOME
          pm2 resurrect
